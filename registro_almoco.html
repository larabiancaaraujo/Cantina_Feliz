<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Almoço - Cantina Escolar</title>
  <link rel="stylesheet" href="registro_almoco.css">
  <script src="registro_almoco.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <header>
    <h1><i class="fas fa-clipboard-list"></i> Registro de Almoço</h1>
  </header>

  <main>
    <section class="refeicao-dia">
      <h2>🍛 Refeições do Dia</h2>
      <div class="cardapio" id="cardapio-dia">
        <p>Carregando refeições...</p>
      </div>
    </section>

    <section class="registro-form">
      <h2>🍽️ Registrar Almoço</h2>
      <form id="almocoForm">
        <label for="comer"><strong>Você irá comer na escola?</strong></label>
        <select id="comer" required>
          <option value="">Selecione...</option>
          <option value="sim">Sim</option>
          <option value="nao">Não</option>
        </select>

        <label for="acompanhamento"><strong>Escolher acompanhamento:</strong></label>
        <select id="acompanhamento" required>
          <option value="">Selecione uma opção...</option>
          <option value="frango">Frango grelhado</option>
          <option value="farofa">Farofa de ovo</option>
          <option value="ovo">Ovo cozido</option>
        </select>

        <button type="submit" class="botao-registrar">Registrar Almoço</button>
      </form>
    </section>
  </main>

  <footer>
    © 2025 Cantina Escolar - Todos os direitos reservados
  </footer>
</body>
</html>
