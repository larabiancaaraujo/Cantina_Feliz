<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Almoço - Cantina Escolar</title>
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>
    <header>
        Registro de Almoço - Cantina Escolar
    </header>

    <div class="form-container">
        <h2>Registrar Dia de Almoço</h2>
        <form id="registroForm">
            <div class="form-group">
                <label for="nome">Nome do Aluno</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>

            <div class="form-group">
                <label for="turma">Turma</label>
                <select id="turma" name="turma" required>
                    <option value="">Selecione a turma</option>
                    <option value="1ADM">1ADM</option>
                    <option value="1DS">1DS</option>
                    <option value="2ADM">2ADM</option>
                    <option value="2DS">2DS</option>
                    <option value="2A">2A</option>
                    <option value="3A">3A</option>
                    <option value="3ADM">3ADM</option>
                    <option value="3A">3A</option>
                    <option value="3B">3B</option>
                </select>
            </div>

            <div class="form-group">
                <label for="data">Dia do Almoço</label>
                <input type="date" id="data" name="data" required>
            </div>

            <button type="submit" class="submit-btn">Registrar</button>
        </form>
        <p id="msgSucesso" class="msg-sucesso"></p>
    </div>

    <footer>
        © 2025 Cantina Escolar - Todos os direitos reservados
    </footer>

    <script src="js/registro.js"></script>
</body>
</html>
