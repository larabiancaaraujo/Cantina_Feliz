<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina Escolar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">

<body>
    <header>
        Cantina Feliz
      
    <div class="form-container">
    </header>
     <div class="logo-cantina">
            <img src="logo.png" alt="Logo Cantina Feliz">
        </div>
        <!-- Logo centralizada -->
    <div class="container">
        <div class="card" onclick="window.location.href='cardapio.html'">
            <i class="fas fa-utensils"></i>
            <h3>Cardápio</h3>
            <p>Confira o cardápio do dia e planeje suas refeições.</p>
        </div>

        <div class="card" onclick="window.location.href='registro_almoco.html'">

            <h3>Registro de Almoço</h3>
            <p>Registre o dia em que você vai almoçar na cantina.</p>
        </div>

        <div class="card" onclick="window.location.href='comida_semana.html'">
            <i class="fas fa-calendar-alt"></i>
            <h3>Comidas da Semana</h3>
            <p>Veja todas as opções de refeições disponíveis durante a semana.</p>

    <footer>

    </footer>
